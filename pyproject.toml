[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm[simple] >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "GMAP"
authors = [
    {name = "Kim E. van Adrichem"}
]
description = "A tool for calculating vibrational and electronic spectra, more to be added."
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3"
]
requires-python = ">= 3.10, < 3.14"
dependencies = [
  "colorama >= 0.4.6",
  "MDAnalysis >= 0.20",
  "numba >= 0.58",
  "numpy >= 1.22",
]

[project.optional-dependencies]
testing = [
    "build >= 1.2.2.post1",
    "dataframe-image >= 0.2.4",
    "flake8 >= 4.0",
    "gprof2dot >= 2024.6.6",
    "numpydoc >= 1.6.0",
    "pandas >= 2.2.1",
    "pydata-sphinx-theme >= 0.14",
    "pytest >= 6.0",
    "pytest-cov >= 2.0",
    "sphinx >= 7.2.6",
    "sphinx-design >= 0.5"
]


[tool.coverage.paths]
source = [
    "source/GMAP/src/",
    "*/source/GMAP/src/",
    "D:\\a\\GMAP\\GMAP\\source\\GMAP\\src\\",
    "C:\\*\\source\\GMAP\\src\\"
]


[tool.coverage.report]
include_namespace_packages = true
skip_empty = true


[tool.coverage.run]
patch = ["subprocess"]


[tool.pytest.ini_options]
addopts = "--cov-config=pyproject.toml --cov-report=term-missing --cov=src -p GMAP.tests.conftest"


[tool.setuptools.package-data]
GMAP = ["sourcefiles/**", "maps/**", "logo.txt"]


[project.scripts]
GMAP = "GMAP.src.tools.cmd_interface:main"


[tool.setuptools]
packages = ["GMAP", "GMAP.src", "GMAP.src.programs", "GMAP.src.tools"]


