[metadata]
name = GMAP
description = A tool for calculating vibrational spectra
author = Kim E. van Adrichem
platforms = unix, linux, osx, win32
version = 0.0.1
classifiers =
    Programming Language :: Python :: 3

[options]
packages = 
    GMAP
    GMAP.src
include_package_data = True
install_requires = 
    numpy >= 1.17, <1.22
    numba >= 0.45
    MDAnalysis >= 0.20

python_requires = 
    >=3.7


[options.extras_require]
testing = 
    pytest>=6.0
    pytest-cov>=2.0
    flake8>=4.0


[options.package_data]
* = 
    sourcefiles/*
    maps/*


[options.entry_points]
console_scripts =
    GMAP = GMAP.entry:main
    